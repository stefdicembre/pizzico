# Pizzico: pings Supabase once a day so the free project doesn't pause after 7 idle days.
# On GitHub this file lives at .github/workflows/keep-supabase-awake.yml
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL  e.g. https://abcdefgh.supabase.co
#   SUPABASE_KEY  the project's publishable (anon) key
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/keepalive?select=id" -H "apikey: $SUPABASE_KEY"
          echo
          echo "Supabase is awake."
