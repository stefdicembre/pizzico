<style>
:root{
  --bg:#fbf4f6; --card:#ffffff; --ink:#2c1f26; --muted:#8c7580; --line:#efdfe5;
  --accent:#b5497a; --accent-soft:#f8e1ec; --green:#3f8a5a; --gold:#e9a825;
  --stef:#3b6fb6; --third:#26795e; --partner:#a65a14; --radius:16px;
  --tilemix:100%; --note-bg:#fff9e8; --note-line:#f0e0a8; --tag-ink:#8f325e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--outer,#e9e2d8);font-family:var(--body,-apple-system,sans-serif);color:var(--ink);display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
#phone{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18)}
@media(max-width:499px){#phone{height:100dvh;max-height:none;box-shadow:none;padding-top:env(safe-area-inset-top)}}
@media(min-width:500px){#phone{height:min(900px,96vh);border-radius:28px}}
#top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
#top h1{font-size:22px;margin:0;letter-spacing:-.5px;flex:1}
#top h1 span{color:var(--accent)}
.who{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.who button{padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.who button.on.stef{background:var(--stef);color:#fff}
.who button.on.partner{background:var(--partner);color:#fff}
#main{flex:1;overflow-y:auto;padding:4px 16px 96px;scroll-behavior:smooth}
#nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(12px + env(safe-area-inset-bottom));z-index:5}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 8px;min-width:58px}
#nav button .ic{font-size:21px;filter:grayscale(1);opacity:.7}
#nav button.on{color:var(--accent);font-weight:700}
#nav button.on .ic{filter:none;opacity:1}
#nav button.add .ic{background:var(--accent);color:#fff;filter:none;opacity:1;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-18px;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.search input{border:0;outline:0;flex:1;background:none;font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);position:relative;text-align:left;display:block;width:100%}
.tile{height:92px;display:flex;align-items:center;justify-content:center;font-size:44px;background-size:cover!important;background-position:center!important}
.hero,.match .t,.jent .t{background-size:cover!important;background-position:center!important}
.photorow{display:flex;gap:14px;align-items:center;margin:-4px 0 12px;font-size:13px}
.photorow button{color:var(--accent);font-weight:600}
.photorow label{color:var(--accent);font-weight:600;cursor:pointer}
.welcome-icon{width:72px;height:72px;border-radius:17px;display:block;margin:0 auto;box-shadow:0 4px 14px rgba(28,21,25,.28)}
.card .body{padding:9px 11px 11px}
.card h3{margin:0 0 4px;font-size:14px;line-height:1.25}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.hearts{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.heart{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.heart.stef{color:#3b6fb6} .heart.partner{color:#a65a14}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--tag-ink);font-size:12px;font-weight:600;margin:0 5px 5px 0}
.tag.alt{background:#e6efe9;color:#2e6a44} .tag.cu{background:#efe9f5;color:#6a4a8c} .tag.cs{background:#f3ecd7;color:#8a6a10}
h1,h2,h3,.card h3{font-family:var(--head,inherit)}
h2{font-size:18px;margin:18px 0 8px}
.note{color:var(--ink)}
.sheet-bg{position:absolute;inset:0;background:rgba(30,20,10,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:85%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px 28px}
.sheet h3{margin:0 0 10px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;text-align:center;display:block;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;display:inline-block}
.field{display:block;margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);outline:0}
.field input[type=checkbox]{width:auto;padding:0;margin:0;flex:none}
.field label.check{display:flex;gap:8px;align-items:center;justify-content:flex-start}
.field textarea{min-height:110px;resize:vertical}
.back{font-size:14px;font-weight:600;color:var(--accent);padding:6px 0}
.hero{height:150px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:76px;margin:6px 0 12px}
.stats{display:flex;gap:8px;margin:10px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center}
.stat b{display:block;font-size:16px}

  else if(s0.includes('/')){ const [a,b]=s0.split('/'); n=a/b; } else n=+s0;
  let unit=(m[2]||'').toLowerCase(); if(unit==='cloves') unit='clove'; if(unit==='cups') unit='cup';
  if(unit==='kg'){n*=1000;unit='g'} if(unit==='l'){n*=1000;unit='ml'}
  return {n,unit};
}
function fmtQty(n,unit,units=S.units){
  if(unit==='g'){
    if(units==='imperial') return n>=454 ? t1(n/453.6)+' lb' : t1(Math.round(n/28.35*2)/2)+' oz';
    return n>=1000 ? t1(n/1000)+'kg' : fmtDec(n)+'g';
  }
  if(unit==='ml'){
    if(units==='imperial') return n>=240 ? fmtFrac(n/240)+(n/240>1?' cups':' cup') : t1(Math.round(n/29.57*2)/2)+' fl oz';
    return n>=1000 ? t1(n/1000)+'l' : fmtDec(n)+'ml';
  }
  const num = n<10 ? fmtFrac(n) : String(Math.round(n));
  if(!unit) return num;
  if(unit==='clove') return num+(n>1?' cloves':' clove');
  return num+' '+unit;
}
function scaleQ(q,f){ const p=parseQ(q); return p?fmtQty(p.n*f,p.unit):q; }
function fixTemp(t){ return S.units==='imperial' ? t.replace(/(\d+)\s*°C/g,(m,c)=>Math.round((+c*9/5+32)/5)*5+'°F') : t; }
function parseIng(text){
  return text.split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^([\d½¼¾\/.]+\s?(?:g|kg|ml|l|tsp|tbsp|cloves?|cups?|oz)?|handful|pinch|small bunch|small|large)\s+(.*)$/i);
    return m?{q:m[1],name:m[2]}:{q:'',name:l};
  });
}

function aisle(name){ const n=name.toLowerCase(); for(const [a,re] of AISLES) if(re.test(n)) return a; return 'Other'; }
function addToShop(items,src,f=1){
  items.forEach(i=>{
    const p=parseQ(i.q); const key=i.name.toLowerCase()+'|'+(p?p.unit:'?'+i.q);
    const ex=S.shop.find(x=>x.key===key);
    if(ex){ if(p&&ex.n!=null) ex.n+=p.n*f; if(src&&!ex.srcs.includes(src)) ex.srcs.push(src); ex.done=false; }
    else S.shop.push({key,name:i.name,n:p?p.n*f:null,unit:p?p.unit:'',raw:i.q,done:false,srcs:src?[src]:[]});
  });
}

function filtered(){

function stars(n){ const k=Math.round(n); return '★'.repeat(k)+'☆'.repeat(5-k); }
function timesTxt(n){ return n===1?'cooked once':n===2?'cooked twice':'cooked '+n+' times'; }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function cookDate(c){ const now=new Date(); now.setHours(0,0,0,0); if(!c.date||c.date==='Today') return now;
  const m=String(c.date).match(/(\d+)\s+([A-Za-z]{3})/); if(!m) return now;
  const d=new Date(now.getFullYear(),MON.indexOf(m[2]),+m[1]); if(d>now) d.setFullYear(d.getFullYear()-1); return d; }
function viewJournal(){
  const now=new Date(); now.setHours(0,0,0,0);
  const logs=recipes.flatMap(r=>r.cooked.map(c=>({r,c,d:cookDate(c)}))).sort((a,b)=>b.d-a.d);
  const forgot=recipes.filter(r=>Object.values(r.favs).some(Boolean)).filter(r=>!r.cooked.length);
  const group=d=>{const days=Math.round((now-d)/864e5); return days<7?'This week':days<14?'Last week':MONTHS[d.getMonth()]+(d.getFullYear()!==now.getFullYear()?' '+d.getFullYear():'');};
  const when=d=>{const days=Math.round((now-d)/864e5); return days===0?'Today':days===1?'Yesterday':days<7?d.toLocaleDateString('en-GB',{weekday:'long'}):d.getDate()+' '+MON[d.getMonth()];};
  let last='', html='';
  logs.forEach(({r,c,d})=>{const g=group(d); if(g!==last){html+=`<div class="jgroup">${g}</div>`; last=g;}
    html+=`<button class="jent" data-act="open" data-v="${r.id}"><div class="t" style="${tileStyle(r)}">${tileText(r)}</div><div style="flex:1"><div><span class="n">${esc(r.title)}</span><span class="st">${stars(c.stars)}</span></div><div class="w"><b style="color:var(--${c.who});font-weight:600">${esc(USERS[c.who].name||'Someone')}</b> · ${when(d)}</div>${c.note?`<div class="q">${esc(c.note)}</div>`:''}</div></button>`;});
  return `${titleTabs()}
  ${logs.length?html:'<div class="empty-state">📔<br>Nothing cooked yet.<br>Open a recipe and tap ‘Cooked it’ to start the journal.</div>'}
  ${forgot.length?`<h2>Favourited but not cooked yet</h2><div class="grid">${forgot.map(card).join('')}</div>`:''}`;
}

function viewShop(){
  const groups={}; S.shop.forEach((it,ix)=>{const a=aisle(it.name); (groups[a]=groups[a]||[]).push([it,ix]);});
  const left=S.shop.filter(i=>!i.done).length;
  return `<h2 style="margin-top:6px">Shopping list</h2>
  <div class="muted" style="margin-bottom:10px">${S.book.members.length>=3?'Shared by everyone in the book · ':S.book.members.length===2?'Shared by both of you · ':''}${left} item${left===1?'':'s'} left · quantities merge automatically</div>
  <div class="row" style="margin-bottom:6px"><input class="search" style="flex:1;margin:0" placeholder="Add an item…" data-in="shopinput" value="${esc(S.shopInput)}"><button class="btn sm" data-act="shopmanual">Add</button></div>
  ${!S.shop.length?`<div class="empty-state">🛒<br>Nothing on the list.<br>Add a recipe's ingredients from its page,<br>or send the whole week's plan.</div>`:ORDER.filter(a=>groups[a]).map(a=>`<div class="aisle">${a}</div>${groups[a].map(([it,ix])=>`<label class="ing ${it.done?'done':''}"><input type="checkbox" data-act="shopchk" data-i="${ix}" ${it.done?'checked':''}><span class="q">${esc(it.n!=null?fmtQty(it.n,it.unit):it.raw)}</span><span style="flex:1">${esc(it.name)}${it.srcs.length?`<div class="muted">${esc(it.srcs.join(', '))}</div>`:''}</span><button data-act="shoprm" data-i="${ix}" class="muted">✕</button></label>`).join('')}`).join('')}
  ${S.shop.length?`<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="shopclear">Clear ticked</button><button class="btn ghost" data-act="shopclearall">Clear all</button></div>`:''}`;
}

function goLabel(){
  const a=S.add, n=a.shots.length, link=a.url.trim(), ig=/instagram\.com/i.test(link);
  return n?`Read recipe (${n} screenshot${n>1?'s':''})`:link?(ig?'Save the link for now':'Read recipe from link'):'Read recipe';
}
function viewAdd(){
  const a=S.add;
  if(a.draft) return viewReview();
  const n=a.shots.length, link=a.url.trim(), ig=/instagram\.com/i.test(link);
  const go=goLabel();
  const tray=n?`<div class="shots">${a.shots.map((x,i)=>`<div class="shot" style="${x.src?`background-image:url(${x.src})`:''}">${x.src?'':esc(x.label)}<span class="num">${i+1}</span><button class="x" data-act="shotrm" data-i="${i}" aria-label="Remove screenshot ${i+1}">✕</button><div class="mv"><button data-act="shotmv" data-i="${i}" data-v="-1" ${i===0?'disabled':''} aria-label="Move earlier">‹</button><button data-act="shotmv" data-i="${i}" data-v="1" ${i===n-1?'disabled':''} aria-label="Move later">›</button></div></div>`).join('')}<label class="shot more" for="shotin"><span style="font-size:22px">+</span>Add more</label></div>
    <div class="muted" style="margin-bottom:14px">Keep them in order, and overlap a line or two between screenshots so nothing slips through.</div>`
   :`<label class="drop big" for="shotin">📷<br><b>Add screenshots</b><br><span class="muted">Open the reel, tap ‘more’ to show the whole caption, then screenshot it. Long caption? Scroll and screenshot each part. Pizzico stitches them together.</span></label>`;
  return `<h2 style="margin-top:6px">Add a recipe</h2>
  ${tray}<input id="shotin" type="file" accept="image/*" multiple hidden>
  <div class="field"><label>Link to the reel or recipe (optional)</label><input data-in="addurl" inputmode="url" placeholder="Paste it from your chat…" value="${esc(a.url)}"><div class="muted" style="margin-top:4px">Saved with the recipe so you can always get back to the original.</div></div>
  <button class="btn" data-act="go">${go}</button>
  <button class="quiet" data-act="blank">Type it in instead</button>
  <button class="quiet" data-act="shotsample" style="font-size:12px">Prototype: try with 3 sample screenshots</button>`;
}

function viewReview(){
  const d=S.add.draft;
  const grp=(label,key,list,multi=true)=>`<div class="field"><label>${label}</label><div class="chips" style="flex-wrap:wrap">${list.map(o=>{const on=multi?d[key].includes(o):d[key]===o;return `<button class="chip ${on?'on':''}" data-act="dtog" data-k="${key}" data-v="${esc(o)}" data-m="${multi?1:0}">${o}</button>`}).join('')}</div></div>`;
  return `<button class="back" data-act="draftcancel">‹ Cancel</button><h2 style="margin-top:4px">${d.editId?'Edit recipe':'Review & save'}</h2>
  ${d.editId?'':`<div class="note">${d.shotCount?`📷 Read from ${d.shotCount} screenshot${d.shotCount>1?'s':''}. Check it over before saving. Nothing is thrown away: the original text is kept with the recipe.`:d.linkOnly?'🔗 Only the link so far. Name it and save, then add the ingredients and steps whenever you like.':'Check what was picked up and fix anything before saving. Suggested tags are pre-selected.'}</div>`}
  ${d.flags&&d.flags.length?`<div class="note warn">⚠️ <b>Check these</b><ul>${d.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul><div class="muted" style="margin-top:6px">Prototype: this flag is staged to show how it will look.</div></div>`:''}
  ${d.origSteps?(()=>{const have=d.metText.split('\n').filter(x=>x.trim()).length;return have===d.origSteps?`<div class="note" style="background:var(--card);border-color:var(--line)">✓ The caption has ${d.origSteps} steps and you have ${have}.</div>`:`<div class="note warn">⚠️ The caption has ${d.origSteps} steps but you have ${have}. Check the method below.</div>`})():''}

// ---------- parsing (simulated; real app will use Claude) ----------
const SAMPLE = `Creamy garlic butter salmon 🐟 ready in 20 mins!\n\nYou need:\n2 salmon fillets\n3 cloves garlic\n50g butter\n100ml double cream\n1 lemon\nhandful spinach\nsalt and pepper\n\nMethod:\nSeason the salmon and sear skin side down for 4 mins.\nFlip, add butter and garlic and baste for 2 mins.\nPour in cream and lemon juice and simmer until thick.\nWilt in the spinach and serve.\n\n#salmon #quickdinner #easyrecipes`;
function parseText(t){
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean).filter(l=>!l.startsWith('#'));
  const title=(lines[0]||'Untitled recipe').replace(/[^\p{L}\p{N}\s',&-]/gu,'').replace(/ready in.*$/i,'').trim();
  const unit=/^(\d+[\d\/.]*\s?(g|kg|ml|l|tsp|tbsp|cloves?|cups?|oz)?\b|\d|a |handful|pinch|small|large|½|¼)/i;
  const ing=[],met=[]; let mode=null;
  lines.slice(1).forEach(l=>{
    if(/^(you need|ingredients)/i.test(l)){mode='i';return}
    if(/^(method|steps|directions|instructions)/i.test(l)){mode='m';return}
    if(mode==='i'||(!mode&&unit.test(l)&&l.length<45)) ing.push(l);
    else if(mode==='m'||l.length>25) met.push(l.replace(/^\d+[.)]\s*/,''));
  });
  const low=t.toLowerCase(); const m=low.match(/(\d+)\s*(min|mins|minutes)/);
  const sug=(list,kw)=>list.filter(o=>kw[o]&&kw[o].some(k=>low.includes(k)));
  return {title,source:'Instagram',url:'',time:m?+m[1]:30,serves:2,effort:'Easy',ingText:ing.join('\n'),metText:met.join('\n'),
    meals:/breakfast|brunch|oats/.test(low)?['Breakfast']:['Dinner'],
    mains:sug(OPTS.mains,{Chicken:['chicken'],Beef:['beef','mince'],Seafood:['salmon','prawn','fish','cod'],Pasta:['pasta','spaghetti','linguine'],Eggs:['egg'],Veg:['aubergine','veg']}),
    diets:/vegan/.test(low)?['Vegan']:/vegetarian/.test(low)?['Vegetarian']:[],cuisine:/thai|curry/.test(low)?'Thai':'',customText:''};
}
function parseShots(n){
  const d=parseText(SAMPLE);
  d.source='Screenshot'; d.shotCount=n; d.original=SAMPLE; d.origSteps=4; d.flags=[];
  if(n>1){ d.flags.push('Couldn’t read the cream amount in screenshot 2. Check it below.'); d.ingText=d.ingText.replace(/^100ml double cream$/m,'double cream (amount?)'); }
  return d;
}
function blankDraft(){return {title:'',source:'Own recipe',url:'',time:30,serves:2,effort:'Easy',ingText:'',metText:'',meals:[],mains:[],diets:[],cuisine:'',customText:''}}

document.addEventListener('click',e=>{

    case 'delyes': {const id=S.view, rr=byId(id); const slots=Object.keys(plan).filter(k=>plan[k]===id); trash.unshift({r:rr,by:me,day:S.day,slots}); recipes=recipes.filter(x=>x.id!==id); slots.forEach(k=>{delete plan[k];}); S.lastDel=id; S.view=null; S.sheet=null; toast('Recipe deleted',true,7000); return;}

    case 'edit': {const x=byId(+v); S.add.draft={editId:x.id,title:x.title,source:x.source,url:x.url||'',time:x.time,serves:x.serves,effort:x.effort,ingText:x.ingredients.map(i=>(i.q?i.q+' ':'')+i.name).join('\n'),metText:x.method.join('\n'),meals:[...x.meals],mains:[...x.mains],diets:[...x.diets],cuisine:x.cuisine,customText:x.custom.join(', ')}; S.view=null; S.tab='add'; break;}

    case 'onbstep': {const o=S.onb[me]; if(!o.name.trim()){toast('Add your name first');return;} o.step=v; o.err=''; break;}
    case 'onbback': {const o=S.onb[me]; o.step='welcome'; o.err=''; o.open=false; break;}
    case 'onbcreate': {const o=S.onb[me]; if(!o.bookName.trim()){toast('Give your recipe book a name');return;}
      if(!USERS[me].name){USERS[me].name=o.name.trim(); USERS[me].initial=o.name.trim()[0].toUpperCase();}

      S.books.push(b); S.dev[me].bookId=b.id; o.open=false; o.step='welcome'; o.bookName='Our Recipe Book'; loadBook(); S.tab='library'; S.view=null; S.sheet='book'; break;}

      if(!USERS[me].name){USERS[me].name=o.name.trim(); USERS[me].initial=o.name.trim()[0].toUpperCase();}
      b.members.push(me); S.dev[me].bookId=b.id; o.open=false; o.step='welcome'; o.code=''; loadBook(); S.tab='library'; S.view=null; toast('Joined '+b.name+' 🎉'); return;}
    case 'mode': S.mode=v; break;

    case 'open': S.view=+v; break;

    case 'rxc': {const c=r.comments[+el.dataset.c]; const arr=(c.reacts[el.dataset.e]=c.reacts[el.dataset.e]||[]); const i=arr.indexOf(me); i<0?arr.push(me):arr.splice(i,1); break;}

    case 'cookmode': S.cook={id:+v,i:0}; break;

      break; }
    case 'shotrm': S.add.shots.splice(+el.dataset.i,1); break;
    case 'shotmv': {const i=+el.dataset.i,j=i+(+v); const sh=S.add.shots; if(j>=0&&j<sh.length){[sh[i],sh[j]]=[sh[j],sh[i]];} break;}
    case 'shotsample': S.add.shots=[1,2,3].map(k=>({src:null,label:'Sample screenshot '+k})); break;
    case 'toggleorig': S.add.showOrig=!S.add.showOrig; break;
    case 'parseshot': S.add.draft=parseText(SAMPLE); S.add.draft.source='Screenshot'; break;
    case 'blank': S.add.draft=blankDraft(); break;
    case 'draftcancel': {const id=S.add.draft&&S.add.draft.editId; S.add.draft=null; if(id){S.view=id;S.tab='library';} break;}
    case 'dtog': {const d=S.add.draft,k=el.dataset.k; if(el.dataset.m==='1'){const i=d[k].indexOf(v); i<0?d[k].push(v):d[k].splice(i,1);} else d[k]=(d[k]===v?'':v); break;}
    case 'save': {
      const d=S.add.draft; if(!d.title.trim()){toast('Add a title first');return;}
      if(d.editId){const x=byId(d.editId); Object.assign(x,{title:d.title.trim(),source:d.source,time:+d.time||30,serves:+d.serves||2,effort:d.effort||'Easy',meals:d.meals,mains:d.mains,diets:d.diets,cuisine:d.cuisine,custom:d.customText.split(',').map(y=>y.trim()).filter(Boolean),ingredients:parseIng(d.ingText),method:d.metText.split('\n').map(y=>y.trim()).filter(Boolean),editedBy:me}); delete S.serves[x.id]; S.add.draft=null; S.tab='library'; S.view=x.id; toast('Changes saved ✓'); return;}
      const emoji=d.mains.includes('Seafood')?'🐟':d.mains.includes('Chicken')?'🍗':d.mains.includes('Pasta')?'🍝':d.mains.includes('Eggs')?'🍳':d.meals.includes('Dessert')?'🍰':'🍽';
      const nr=R({title:d.title.trim(),emoji,color:['#fbe0cc','#e8def0','#f6ead0','#dcebe0','#f3d9d3'][nid%5],time:+d.time||30,effort:d.effort||'Easy',serves:+d.serves||2,meals:d.meals,mains:d.mains,diets:d.diets,cuisine:d.cuisine,custom:d.customText.split(',').map(x=>x.trim()).filter(Boolean),source:d.source,url:d.url||'',added:me,
        ingredients:parseIng(d.ingText),
        method:d.metText.split('\n').map(x=>x.trim()).filter(Boolean)}); if(d.original) nr.original=d.original;
      recipes.unshift(nr); S.add.draft=null; S.add.text=''; S.add.shots=[]; S.add.url=''; S.tab='library'; S.view=nr.id; toast('Saved to the library ✓'); return;
    }
  }
  render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='shotin'&&el.files&&el.files.length){ [...el.files].forEach(f=>S.add.shots.push({src:URL.createObjectURL(f),label:f.name})); el.value=''; render(); return; }
  if(el.id==='photoin'&&el.files&&el.files[0]){ const r=byId(S.view); const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,900/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); r.photo=c.toDataURL('image/jpeg',.82); r.photoBy=S.me; toast('Photo added'); render(); }; im.src=fr.result; }; fr.readAsDataURL(el.files[0]); return; }
  if(el.dataset.act==='shopchk'){S.shop[+el.dataset.i].done=el.checked; render(); return;}
  if(el.dataset.act==='chk'){const r=byId(S.view); const c=S.checked[r.id]=S.checked[r.id]||{}; c[el.dataset.i]=el.checked; render();}
});
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset.in; if(!k) return;
  const v=el.value, d=S.add.draft;
  const m={q:()=>{S.q=v;render();const q=$('#q');q.focus();q.setSelectionRange(v.length,v.length);},
    note:()=>{byId(S.view).notes[S.me].text=v},cmt:()=>{S.commentDraft=v},ci:()=>{S.cantInput=v},quickinput:()=>{S.quickInput=v},shopinput:()=>{S.shopInput=v},onb_name:()=>{S.onb[S.me].name=v},onb_book:()=>{S.onb[S.me].bookName=v},onb_code:()=>{S.onb[S.me].code=v},bookname:()=>{S.book.name=v},
    addtext:()=>{S.add.text=v},addurl:()=>{S.add.url=v; const g=document.querySelector('[data-act=go]'); if(g) g.textContent=goLabel();},ratenote:()=>{S.rateDraft.note=v},
    d_title:()=>{d.title=v},d_source:()=>{d.source=v},d_time:()=>{d.time=v},d_serves:()=>{d.serves=v},d_ing:()=>{d.ingText=v},d_met:()=>{d.metText=v},d_custom:()=>{d.customText=v}};
  m[k]&&m[k]();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(e.target.dataset.in==='ci'){S.cantInput.trim()&&document.querySelector('[data-act=cantadd]').click();}
  if(e.target.dataset.in==='quickinput'){document.querySelector('[data-act=quickadd]').click();}
  if(e.target.dataset.in==='shopinput'){document.querySelector('[data-act=shopmanual]').click();}
  if(e.target.dataset.in==='cmt'){document.querySelector('[data-act=postc]').click();}
});
render();
</script>
</body>
