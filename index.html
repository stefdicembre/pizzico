<style>
:root{
  --bg:#fcf5f8; --card:#ffffff; --ink:#1c1519; --muted:#735d69; --line:#f1dfe8; --field:#9c8090;
  --accent:#c2186f; --accent-soft:#fde4f0; --on-accent:#ffffff; --danger:#b3261e; --green:#2f7a4a; --gold:#a87200; --err-bg:#fdeaea; --err-line:#f0b8b8;
  --stef:#3b6fb6; --third:#26795e; --partner:#a65a14; --radius:16px;
  --tilemix:100%; --note-bg:#fff9e8; --note-line:#f0e0a8; --tag-ink:#8f325e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--outer,#e9e2d8);font-family:var(--body,-apple-system,sans-serif);color:var(--ink);display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
#phone{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18)}
@media(max-width:499px){#phone{height:100dvh;max-height:none;box-shadow:none;padding-top:env(safe-area-inset-top)}}
@media(min-width:500px){#phone{height:min(900px,96vh);border-radius:28px}}
#top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
#top h1{font-size:22px;margin:0;letter-spacing:-.5px;flex:1}
#top h1 span{color:var(--accent)}
.who{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.who button{padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.who button.on.stef{background:var(--stef);color:#fff}
.who button.on.partner{background:var(--partner);color:#fff}
#main{flex:1;overflow-y:auto;padding:4px 16px 96px;scroll-behavior:smooth}
#nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(12px + env(safe-area-inset-bottom));z-index:5}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 8px;min-width:58px}
#nav button .ic{display:flex;align-items:center;justify-content:center;height:26px;opacity:.8}
#nav button.on{color:var(--accent);font-weight:700}
#nav button.on .ic{opacity:1}
#nav button.add .ic{background:var(--accent);color:var(--on-accent);opacity:1;width:46px;height:46px;border-radius:50%;margin-top:-18px;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.i{display:inline-block;vertical-align:-.18em;flex:none}
.i.fill path{fill:currentColor}
.search .i{color:var(--muted)}
.es-ic{display:block;margin:0 auto 10px}
.steps{display:flex;align-items:center;gap:6px;margin:8px 0 2px;font-size:12px;font-weight:700;color:var(--muted)}
.steps span{margin-right:4px;white-space:nowrap}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.addh{font-size:25px;margin:16px 0 6px;letter-spacing:-.4px}
.how{color:var(--muted);font-size:15px;margin-bottom:18px;line-height:1.5}
.how b{color:var(--ink);font-weight:600}
.pastebox{display:flex;gap:8px;background:var(--card);border:1px solid var(--field);border-radius:14px;padding:6px 6px 6px 12px;margin-bottom:14px;align-items:center}
.pastebox input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0;padding:8px 0}
.pastebox button{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;border-radius:10px;padding:9px 12px}
.addfoot{margin-top:26px}
.alt-way{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.alt-way .muted{font-size:14px;margin-bottom:8px}
.btn.alt{background:var(--card);color:var(--accent);border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;text-align:left;color:var(--ink)}
.opt>.i{color:var(--accent)}
.opt b{flex:1;font-size:15px;font-weight:600}
div.opt{display:block}
div.opt .row{margin-bottom:10px;gap:12px}
div.opt .row .i{color:var(--accent)}
div.opt .pastebox{margin:0;background:var(--bg)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--field);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.search input{border:0;outline:0;flex:1;background:none;font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);position:relative;text-align:left;display:block;width:100%}
.tile{height:92px;display:flex;align-items:center;justify-content:center;font-size:44px;background-size:cover!important;background-position:center!important}
.hero,.match .t,.jent .t{background-size:cover!important;background-position:center!important}
.photorow{display:flex;gap:14px;align-items:center;margin:-4px 0 12px;font-size:13px}
.photorow button{color:var(--accent);font-weight:600}
.photorow label{color:var(--accent);font-weight:600;cursor:pointer;padding:10px 0;display:inline-flex;align-items:center;gap:5px}
.welcome-icon{width:80px;height:80px;border-radius:19px;display:block;margin:0 auto;box-shadow:0 6px 22px color-mix(in srgb,#ff7eb6 35%,transparent)}
:root[data-dark] .welcome-icon{box-shadow:0 0 0 1px #3a2b33,0 6px 26px color-mix(in srgb,#ff7eb6 22%,transparent)}
.card .body{padding:9px 11px 11px}
.card h3{margin:0 0 4px;font-size:14px;line-height:1.25}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.hearts{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.heart{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.heart.stef{color:#3b6fb6} .heart.partner{color:#a65a14}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--tag-ink);font-size:12px;font-weight:600;margin:0 5px 5px 0}
.tag.alt{background:#e6efe9;color:#2e6a44} .tag.cu{background:#efe9f5;color:#6a4a8c} .tag.cs{background:#f3ecd7;color:#765a0c}
h1,h2,h3,.card h3{font-family:var(--head,inherit)}
h2{font-size:18px;margin:18px 0 8px}
.note{color:var(--ink)}
::placeholder{color:var(--muted);opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search:focus-within,.pastebox:focus-within,.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){#main{scroll-behavior:auto}}
.tlink{padding:10px 2px!important;margin:-10px 0}
.sheet .xclose{float:right;margin:-6px -6px 0 8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.err{background:var(--err-bg)!important;border-color:var(--err-line)!important}
.sheet-bg{position:absolute;inset:0;background:rgba(30,20,10,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:85%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px 28px}
.sheet h3{margin:0 0 10px}
.btn{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 16px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;display:inline-flex}
.field{display:block;margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--field);border-radius:12px;padding:10px 12px;background:var(--card);outline:0}
.field input[type=checkbox]{width:auto;padding:0;margin:0;flex:none}
.field label.check{display:flex;gap:8px;align-items:center;justify-content:flex-start}
.field textarea{min-height:110px;resize:vertical}
.back{font-size:14px;font-weight:600;color:var(--accent);padding:6px 0;display:inline-flex;align-items:center;gap:2px}
.hero{height:150px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:76px;margin:6px 0 12px}
.stats{display:flex;gap:8px;margin:10px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center}
.stat b{display:block;font-size:16px}
.stat span{font-size:11px;color:var(--muted)}
.ing{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;font-size:15px}
.ing input{width:20px;height:20px;accent-color:var(--accent)}
.ing.done span{text-decoration:line-through;color:var(--muted)}
.ing .q{font-weight:700;min-width:64px}
.step{display:flex;gap:12px;padding:10px 0}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.step p{margin:2px 0;line-height:1.45;font-size:15px}
.step.done p{color:var(--muted);text-decoration:line-through}
.step.done .n{background:var(--line);color:var(--muted)}
.favbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.favbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:8px}
.bubble .h{font-size:12px;font-weight:700;margin-bottom:2px}
.bubble.stef .h{color:var(--stef)} .bubble.partner .h{color:var(--partner)}
.rx{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.rx button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 11px;font-size:14px;min-height:32px}
.rx button.mine{background:var(--accent-soft);border-color:var(--accent)}
.stars button{font-size:30px;color:var(--muted);padding:4px;min-width:44px;min-height:44px}
.stars button.on{color:var(--gold)}
.tabs{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.note.warn{border-color:var(--accent);background:var(--accent-soft)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.btn[disabled]{opacity:1;cursor:progress}
.note.warn ul{margin:6px 0 0 18px;padding:0}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.shot{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
.shot .num{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:12px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.shot .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;width:26px;height:26px;border-radius:50%;font-size:13px}
.shot .mv{position:absolute;bottom:4px;display:flex;justify-content:space-between;left:4px;right:4px}

// Options for a group: the built-in list, plus anything already used on a recipe (or in the draft being edited).
function optsFor(field, extra){
  const base=OPTS[field==='cuisine'?'cuisines':field];
  const used=recipes.flatMap(r=>field==='cuisine'?[r.cuisine]:(r[field]||[])).concat(extra||[]);
  const out=[...base], low=new Set(base.map(x=>x.toLowerCase()));

}

function applyOpt(){

// ---------- quantities, scaling, units ----------
const FR={0.25:'¼',0.5:'½',0.75:'¾'};
function fmtFrac(n){ let q=Math.round(n*4)/4; if(q<0.25) q=0.25; const w=Math.floor(q), f=q-w; return String((w?w:'')+(f?FR[f]:'')); }
function fmtDec(n){ if(n>=100) return Math.round(n/5)*5; if(n>=10) return Math.round(n); return Math.round(n*10)/10; }
const t1=x=>String(+x.toFixed(1));
function parseQ(q){
  const m=String(q).trim().match(/^(\d+\s*[½¼¾]|[½¼¾]|\d+(?:\.\d+)?(?:\/\d+)?)\s*([a-zA-Z]+)?$/);
  if(!m) return null;
  const s0=m[1], fr={'½':.5,'¼':.25,'¾':.75}; let n;

  if(unit==='kg'){n*=1000;unit='g'} if(unit==='l'){n*=1000;unit='ml'}

    return n>=1000 ? t1(n/1000)+'kg' : fmtDec(n)+'g';
  }
  if(unit==='ml'){
    if(units==='imperial') return n>=240 ? fmtFrac(n/240)+(n/240>1?' cups':' cup') : t1(Math.round(n/29.57*2)/2)+' fl oz';
    return n>=1000 ? t1(n/1000)+'l' : fmtDec(n)+'ml';
  }
  const num = n<10 ? fmtFrac(n) : String(Math.round(n));
  if(!unit) return num;
  if(unit==='clove') return num+(n>1?' cloves':' clove');
  return num+' '+unit;
}
function scaleQ(q,f){ const p=parseQ(q); return p?fmtQty(p.n*f,p.unit):q; }
const GAS={1:[140,275],2:[150,300],3:[160,325],4:[180,350],5:[190,375],6:[200,400],7:[220,425],8:[230,450],9:[240,475]};
function fixTemp(t){ t=t.replace(/\bgas\s*mark\s*([1-9])\b(?!\s*\()/gi,(m,g)=>m+' ('+(S.units==='imperial'?GAS[g][1]+'°F':GAS[g][0]+'°C')+')'); return S.units==='imperial' ? t.replace(/(\d+)\s*°C/g,(m,c)=>Math.round((+c*9/5+32)/5)*5+'°F') : t; }
function parseIng(text){
  return text.split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^([\d½¼¾\/.]+\s?(?:g|kg|ml|l|tsp|tbsp|cloves?|cups?|oz)?|handful|pinch|small bunch|small|large)\s+(.*)$/i);
    return m?{q:m[1],name:m[2]}:{q:'',name:l};
  });
}

const AISLES=[['Meat & fish',/chicken|beef|pork|salmon|prawn|fish|bacon|mince|cod|shin/],['Cupboard',/pasta|gnocchi|linguine|pappardelle|oats|rice|flour|sugar|sauce|oil|vinegar|miso|mirin|syrup|honey|seeds|cumin|paprika|powder|cornflour|purée|wine|chia|peanut|vanilla|noodle|flakes|chopped tomatoes/],['Dairy & eggs',/egg|milk|cream|cheese|parmesan|feta|yoghurt|butter/],['Fruit & veg',/spinach|tomato|garlic|onion|pepper|lemon|banana|carrot|aubergine|parsley|rosemary|chilli|avocado|lime|ginger|mushroom|potato|courgette|coriander|basil/]];
function aisle(name){ const n=name.toLowerCase(); for(const [a,re] of AISLES) if(re.test(n)) return a; return 'Other'; }
function addToShop(items,src,f=1){
  items.forEach(i=>{
    const p=parseQ(i.q); const key=i.name.toLowerCase()+'|'+(p?p.unit:'?'+i.q);
    const ex=S.shop.find(x=>x.key===key);
    if(ex){ if(p&&ex.n!=null) ex.n+=p.n*f; if(src&&!ex.srcs.includes(src)) ex.srcs.push(src); ex.done=false; }
    else S.shop.push({key,name:i.name,n:p?p.n*f:null,unit:p?p.unit:'',raw:i.q,done:false,srcs:src?[src]:[]});
  });
}

function filtered(){
  const q=S.q.trim().toLowerCase();
  return recipes.filter(r=>{
    if(S.favOnly && !Object.values(r.favs).some(Boolean)) return false;
    const f=S.f;
    if(f.meals.length && !f.meals.some(x=>r.meals.includes(x))) return false;
    if(f.mains.length && !f.mains.some(x=>r.mains.includes(x))) return false;
    if(f.diets.length && !f.diets.every(x=>r.diets.includes(x))) return false;
    if(f.cuisines.length && !f.cuisines.includes(r.cuisine)) return false;
    if(f.custom.length && !f.custom.some(x=>r.custom.includes(x))) return false;
    if(f.times.length && !f.times.includes(timeBucket(r.time))) return false;
    if(q){ const hay=(r.title+' '+allTags(r).join(' ')+' '+r.ingredients.map(i=>i.name).join(' ')).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

// ---------- accessibility pass: label inputs, mark toggle state ----------
function a11yPass(){
  document.querySelectorAll('#phone input:not([type=checkbox]):not([type=file]), #phone textarea').forEach(el=>{
    if(el.getAttribute('aria-label')) return;
    const l=el.closest('.field')&&el.closest('.field').querySelector(':scope > label');
    const t=(l&&l.textContent.trim())||el.placeholder||''; if(t) el.setAttribute('aria-label',t);
  });
  document.querySelectorAll('#phone .chip[data-act=togf], #phone .chip[data-act=favonly], #phone .chip[data-act=dtog], #phone .tabs button, #phone .ttabs button').forEach(el=>el.setAttribute('aria-pressed',el.classList.contains('on')));
}

function viewCant(){

  const sugg=S.quick.filter(n=>!have.includes(n));

  if(have.length){
    res=recipes.map(r=>{
      const core=r.ingredients.map(i=>i.name.toLowerCase()).filter(n=>!STAPLES.includes(n));
      const hv=core.filter(n=>have.some(h=>n.includes(h)||h.includes(n)));

  const left=S.shop.filter(i=>!i.done).length;
  return `<h2 style="margin-top:6px">Shopping list</h2>
  <div class="muted" style="margin-bottom:10px">${S.book.members.length>=3?'Shared by everyone in the book · ':S.book.members.length===2?'Shared by both of you · ':''}${left} item${left===1?'':'s'} left · quantities merge automatically</div>
  <div class="row" style="margin-bottom:6px"><input class="search" style="flex:1;margin:0" placeholder="Add an item…" data-in="shopinput" value="${esc(S.shopInput)}"><button class="btn sm" data-act="shopmanual">Add</button></div>
  ${!S.shop.length?`<div class="empty-state">${ic('bag',36,'es-ic')}Nothing on the list.<br>Add a recipe's ingredients from its page,<br>or send the whole week's plan.</div>`:ORDER.filter(a=>groups[a]).map(a=>`<div class="aisle">${a}</div>${groups[a].map(([it,ix])=>`<label class="ing ${it.done?'done':''}"><input type="checkbox" data-act="shopchk" data-i="${ix}" ${it.done?'checked':''}><span class="q">${esc(it.n!=null?fmtQty(it.n,it.unit):it.raw)}</span><span style="flex:1">${esc(it.name)}${it.srcs.length?`<div class="muted">${esc(it.srcs.join(', '))}</div>`:''}</span><button data-act="shoprm" data-i="${ix}" class="muted" aria-label="Remove" style="padding:8px;margin:-8px -6px">${ic('x',15)}</button></label>`).join('')}`).join('')}
  ${S.shop.length?`<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="shopclear">Clear ticked</button><button class="btn ghost" data-act="shopclearall">Clear all</button></div>`:''}`;

function addSteps(n){ return `<div class="steps"><span>Step ${n} of 3</span>${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`; }
const isIG = u => /instagram\.com|instagr\.am/i.test(u);
// Pull just the Instagram link out of whatever was copied, minus tracking (?igsh=…) and #bits.
const cleanIG = t => { const m=String(t).match(/(?:https?:\/\/)?(?:www\.)?(?:instagram\.com|instagr\.am)\/[^\s"'<>]+/i); if(!m) return String(t).trim(); let u=m[0].replace(/[?#].*$/,'').replace(/[).,!]+$/,''); if(!/^https?:\/\//i.test(u)) u='https://'+u; return u.replace(/^http:/i,'https:'); };
function viewAdd(){
  const a=S.add;
  if(a.draft) return viewReview();
  if(a.step==='other') return viewAddOther();
  if(a.step==='caption') return viewAddCaption();
  return `${addSteps(1)}
  <h2 class="addh">Paste the Instagram link</h2>
  <div class="how">In Instagram, tap ${ic('send',16)} <b>Share</b>, then <b>Copy link</b>.</div>
  <div class="pastebox"><input data-in="addurl" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="instagram.com/reel/…" value="${esc(a.url)}"><button data-act="pasteurl">${ic('clipboard',16)}Paste</button></div>
  ${a.dup?dupNote(a.dup,'ig'):''}
  <button class="btn" data-act="addnext">Next</button>
  <div class="addfoot alt-way"><div class="muted">Not from Instagram?</div>
  <button class="btn alt" data-act="addstep" data-v="other">Add from a website or screenshot</button></div>`;
}
// ---------- duplicate links: is this link already in the book (or in Recently deleted)? ----------
function urlKey(u){ u=String(u||'').trim(); if(!u) return '';
  const ig=u.match(/instagram\.com\/(?:[^\/?#]+\/)?(?:reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i); if(ig) return 'ig:'+ig[1];
  try{ const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u);
    const keep=[...x.searchParams.entries()].filter(([k])=>!/^(utm_|fbclid|gclid|igsh|igshid|ref$|mc_|_hs)/i.test(k)).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>k+'='+v).join('&');
    return (x.hostname.replace(/^www\./,'')+x.pathname.replace(/\/+$/,'')+(keep?'?'+keep:'')).toLowerCase(); }catch(e){ return u.toLowerCase(); } }
function dupOf(u){ const k=urlKey(u); if(!k) return null;
  const r=recipes.find(x=>x.url&&urlKey(x.url)===k); if(r) return {r,trashed:false,key:k};
  const t=trash.find(x=>x.r.url&&urlKey(x.r.url)===k); return t?{r:t.r,trashed:true,key:k}:null; }
function dupNote(du,kind){
  const r=du.r, who=r.added===S.me?'you':(USERS[r.added]?USERS[r.added].name:'someone');
  return `<div class="note warn" role="alert">${ic('alert',15)} <b>Already in your book</b>
    <div style="margin-top:4px">${du.trashed?`‘${esc(r.title||'Untitled')}’ was deleted recently.`:`‘${esc(r.title||'Untitled')}’ was saved by ${esc(who)} from this link.`}</div>
    <div class="row" style="gap:8px;margin-top:8px">${du.trashed?`<button class="btn alt sm" data-act="dupseetrash">Recently deleted</button>`:`<button class="btn alt sm" data-act="dupopen" data-v="${r.id}">Open it</button>`}<button class="btn ghost sm" data-act="dupanyway" data-k="${kind}">Add it anyway</button></div></div>`;
}
function viewAddCaption(){
  const a=S.add, n=a.shots.length, ig=a.src!=='shots';
  const tray=n?`<div class="shots">${a.shots.map((x,i)=>`<div class="shot" style="${x.src?`background-image:url(${x.src})`:''}">${x.src?'':esc(x.label)}<span class="num">${i+1}</span><button class="x" data-act="shotrm" data-i="${i}" aria-label="Remove screenshot ${i+1}">${ic('x',14)}</button><div class="mv"><button data-act="shotmv" data-i="${i}" data-v="-1" ${i===0?'disabled':''} aria-label="Move earlier">${ic('chevL',16)}</button><button data-act="shotmv" data-i="${i}" data-v="1" ${i===n-1?'disabled':''} aria-label="Move later">${ic('chevR',16)}</button></div></div>`).join('')}<label class="shot more" for="shotin">${ic('plus',22)}Add more</label></div>
    <div class="muted" style="margin-bottom:14px">Keep them in order. Overlap a line or two.</div>`
   :`<label class="drop big" for="shotin">${ic('image',30)}<b>Add screenshots</b><span class="muted">${ig?'Tap ‘more’ to open the caption, then screenshot it. Long caption? Take a few.':'Pick one or more. Long recipe? Take a few.'}</span></label>`;
  const paste=`<div class="field"><textarea data-in="addtext" placeholder="Paste the caption here" style="min-height:180px">${esc(a.text)}</textarea></div>`;

  <button class="btn" data-act="go" ${a.busy?'disabled aria-busy="true"':''}>${a.busy?'<span class="spin" aria-hidden="true"></span>Reading the recipe…':`Read recipe${!a.pasteOpen&&n?` (${n})`:''}`}</button>${a.busy?`<div class="muted" role="status" style="text-align:center;margin-top:8px;font-size:13px">This takes about ${!a.pasteOpen&&n>1?'20':'10'} seconds.</div>`:''}
  ${ig?`<div class="addfoot" style="margin-top:14px"><button class="quiet" data-act="pastetoggle">${a.pasteOpen?'Use screenshots instead':'Copied the caption? Paste it instead'}</button>
  <button class="quiet" data-act="linkonly">Skip for now and save just the link</button></div>`:''}`;
}

function viewReview(){

  ${d.editId?'':`<div class="muted" style="margin:-2px 0 14px;font-size:14px">${d.linkOnly?'Just the link for now. Fill in the rest whenever you like.':d.shotCount?`Read from ${d.shotCount} screenshot${d.shotCount>1?'s':''}. Fix anything that looks off.`:d.readBy==='schema'?'Read from the recipe on that page. Fix anything that looks off.':'Fix anything that looks off.'}</div>`}
  ${d.dupNote?`<div class="note warn" role="alert">${ic('alert',15)} <b>Already in your book.</b> ‘${esc(d.dupNote.r.title||'Untitled')}’ ${d.dupNote.trashed?'was deleted recently':'has this link'}. Tap Save again to add it anyway.</div>`:''}
  ${d.cutOff?`<div class="note warn">${ic('alert',15)} <b>This looks cut off.</b>${d.cutWhy?` ${esc(d.cutWhy)}`:''}<div style="margin-top:8px"><button class="btn alt sm" data-act="addnextshot">Add the next screenshot</button></div></div>`:''}
  ${d.flags&&d.flags.length?`<div class="note warn">${ic('alert',15)} <b>Check these</b><ul>${d.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:''}

// ---------- parsing (rough guesses for tags; the recipe itself is read by Claude) ----------
function parseText(t){
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean).filter(l=>!l.startsWith('#'));
  const title=(lines[0]||'Untitled recipe').replace(/[^\p{L}\p{N}\s',&-]/gu,'').replace(/ready in.*$/i,'').trim();
  const unit=/^(\d+[\d\/.]*\s?(g|kg|ml|l|tsp|tbsp|cloves?|cups?|oz)?\b|\d|a |handful|pinch|small|large|½|¼)/i;
  const ing=[],met=[]; let mode=null;
  lines.slice(1).forEach(l=>{
    if(/^(you need|ingredients)/i.test(l)){mode='i';return}
    if(/^(method|steps|directions|instructions)/i.test(l)){mode='m';return}
    if(mode==='i'||(!mode&&unit.test(l)&&l.length<45)) ing.push(l);
    else if(mode==='m'||l.length>25) met.push(l.replace(/^\d+[.)]\s*/,''));
  });
  const low=t.toLowerCase(); const m=low.match(/(\d+)\s*(min|mins|minutes)/);
  const sug=(list,kw)=>list.filter(o=>kw[o]&&kw[o].some(k=>low.includes(k)));
  return {title,source:'Instagram',url:'',time:m?+m[1]:30,serves:2,effort:'Easy',ingText:ing.join('\n'),metText:met.join('\n'),
    meals:/breakfast|brunch|oats/.test(low)?['Breakfast']:['Dinner'],
    mains:sug(OPTS.mains,{Chicken:['chicken'],Beef:['beef','mince'],Seafood:['salmon','prawn','fish','cod'],Pasta:['pasta','spaghetti','linguine'],Eggs:['egg'],Veg:['aubergine','veg']}),
    diets:/vegan/.test(low)?['Vegan']:/vegetarian/.test(low)?['Vegetarian']:[],cuisine:/thai|curry/.test(low)?'Thai':'',customText:''};
}
function blankDraft(){return {title:'',source:'Own recipe',url:'',time:30,serves:2,effort:'Easy',ingText:'',metText:'',meals:[],mains:[],diets:[],cuisine:'',customText:''}}

// ---------- real recipe reading (Claude, via the Supabase function) ----------
// READER_URL: the read-recipe function's address.
const READER_URL = 'https://iqfcqxjgxrfkmrbrthmd.supabase.co/functions/v1/read-recipe';
const store = { get(k){ try{ return localStorage.getItem('pizzico.'+k)||''; }catch(e){ return ''; } }, set(k,v){ try{ localStorage.setItem('pizzico.'+k,v); }catch(e){} } };
S.readModel = store.get('readmodel')||'haiku';
const readerReady = () => !!(READER_URL && sb && S.me);
// Shrink a screenshot on the phone before sending (long edge 1568px, which is what Claude reads at anyway).
function shrinkShot(file){
  return new Promise((ok,bad)=>{ const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const k=Math.min(1,1568/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u);
      ok({type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]}); };
    im.onerror=()=>{ URL.revokeObjectURL(u); bad(new Error('One of the screenshots couldn’t be opened.')); }; im.src=u; });
}
async function askReader(body){
  let r, tok='';
  try{ const g=await sb.auth.getSession(); tok=(g.data&&g.data.session&&g.data.session.access_token)||''; }catch(e){}
  try{ r=await fetch(READER_URL,{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY,'authorization':'Bearer '+tok},body:JSON.stringify({...body,model:S.readModel})}); }
  catch(e){ throw new Error('Couldn’t reach Pizzico’s reader. Check your connection and try again.'); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok) throw new Error(j.error||'Reading failed. Try again.');
  return j;
}
// Turn the reader's answer into a review-screen draft.
function draftFrom(res,extra){
  const x=res.recipe, d=blankDraft();
  const low=(x.title+' '+x.ingredients.map(i=>i.item).join(' ')).toLowerCase();
  const guess=parseText(x.title+'\n'+x.ingredients.map(i=>i.item).join('\n'));
  Object.assign(d,{title:x.title, time:x.minutes||30, serves:x.serves||2, effort:x.effort||'Easy',
    ingText:x.ingredients.map(i=>(i.qty?i.qty+' ':'')+i.item).join('\n'),
    metText:[...x.steps,...x.tips.map(t=>'Tip: '+t)].join('\n'),
    meals:x.meal_types.length?x.meal_types:(res.via==='schema'?guess.meals:[]), mains:x.main_ingredients.length?x.main_ingredients:(res.via==='schema'?guess.mains:[]),
    diets:x.diets, cuisine:x.cuisine, original:x.original_text||'', origSteps:x.source_step_count||0, methodMissing:!!x.method_missing, flags:x.flags, cutOff:!!x.looks_cut_off, cutWhy:x.cut_off_reason||'', readBy:res.via==='schema'?'schema':'claude'}, extra);
  if(x.method_missing){ d.fromPost=[...x.steps,...x.tips].filter(Boolean).join('\n'); d.metText=''; }
  if(x.not_a_recipe){ d.flags=['This doesn’t look like a recipe. Check you picked the right screenshots.',...d.flags]; }
  return d;
}

function friendly(e){

}

// ----- saving: spot what changed since the database last held it, and send just that -----
function queueSync(){ if(!sb||!S.me) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,500); }
async function pushRecipe(b,r,isDel){
  const data=strip(r), norm=canon(data), when=new Date().toISOString();
  if(!r.sid){
    r.sid=crypto.randomUUID(); saved.rec.set(r.sid,norm); saved.del.set(r.sid,isDel);
    const {error}=await sb.from('recipes').insert({id:r.sid,book_id:b.id,data,created_by:S.me,deleted_at:isDel?when:null,deleted_by:isDel?S.me:null});
    if(error){ saved.rec.delete(r.sid); saved.del.delete(r.sid); r.sid=null; throw error; }
    return;
  }
  const prevRec=saved.rec.get(r.sid), prevDel=!!saved.del.get(r.sid), patch={};
  if(prevRec!==norm) patch.data=data;
  if(isDel!==prevDel){ patch.deleted_at=isDel?when:null; patch.deleted_by=isDel?S.me:null; }
  if(!Object.keys(patch).length) return;
  saved.rec.set(r.sid,norm); saved.del.set(r.sid,isDel);
  const {error}=await sb.from('recipes').update(patch).eq('id',r.sid);
  if(error){ saved.rec.set(r.sid,prevRec); saved.del.set(r.sid,prevDel); throw error; }
}
async function syncNow(){
  if(!sb||!S.me) return;
  if(syncBusy){ syncAgain=true; return; }
  syncBusy=true;
  try{
    syncOut();
    for(const b of S.books){
      const nm=(b.name||'').trim();
      if(nm&&saved.book.has(b.id)&&saved.book.get(b.id)!==b.name){
        const prev=saved.book.get(b.id); saved.book.set(b.id,b.name);
        const {error}=await sb.from('books').update({name:nm}).eq('id',b.id);
        if(error){ saved.book.set(b.id,prev); throw error; }
      }
      for(const r of [...b.recipes]) await pushRecipe(b,r,false);
      for(const t of [...b.trash]) await pushRecipe(b,t.r,true);
    }
  }catch(e){ console.warn('save failed, will retry',e); setTimeout(queueSync,5000); }
  finally{ syncBusy=false; if(syncAgain){ syncAgain=false; queueSync(); } }
}

  const el=document.activeElement, k=el&&el.dataset&&el.dataset.in, s=el&&el.selectionStart, e2=el&&el.selectionEnd;
  render();
  if(k){ const n=document.querySelector('[data-in="'+k+'"]'); if(n){ n.focus({preventScroll:true}); try{ n.setSelectionRange(s,e2); }catch(_){} } }
}
function dropLocal(sid){
  S.books.forEach(b=>{
    const i=b.recipes.findIndex(x=>x.sid===sid); if(i>=0){ if(S.view===b.recipes[i].id) S.view=null; b.recipes.splice(i,1); }
    const j=b.trash.findIndex(t=>t.r.sid===sid); if(j>=0) b.trash.splice(j,1);
  });
  saved.rec.delete(sid); saved.del.delete(sid);
}
function onRecipeChange(p){
  try{
    if(p.eventType==='DELETE'){ const sid=p.old&&p.old.id; if(sid){ dropLocal(sid); renderKeepFocus(); } return; }
    const row=p.new; if(!row||!row.id) return;
    syncOut();
    const b=S.books.find(x=>x.id===row.book_id); if(!b){ queueReload(); return; }
    const isDel=!!row.deleted_at, norm=normPayload(row);
    const r=b.recipes.find(x=>x.sid===row.id), t=b.trash.find(x=>x.r.sid===row.id), cur=r||(t&&t.r);
    if(cur&&saved.rec.get(row.id)===norm&&saved.del.get(row.id)===isDel) return;   // that's just our own save coming back
    const target=cur?applyRow(cur,row):Object.assign(recFromRow(row),{id:++nid});
    saved.rec.set(row.id,norm); saved.del.set(row.id,isDel);
    if(r&&isDel){ b.recipes.splice(b.recipes.indexOf(r),1); b.trash.unshift({r:target,by:row.deleted_by,day:S.day,slots:[]}); if(S.view===target.id) S.view=null; }
    else if(t&&!isDel){ b.trash.splice(b.trash.indexOf(t),1); b.recipes.unshift(target); }
    else if(!cur){ if(isDel) b.trash.unshift({r:target,by:row.deleted_by,day:S.day,slots:[]}); else b.recipes.unshift(target); }
    renderKeepFocus();
  }catch(e){ console.warn('live update',e); }
}
function queueReload(){
  clearTimeout(loadTimer);
  loadTimer=setTimeout(async()=>{
    if(!sb||!S.me) return;
    try{ await syncNow(); const dropped=await loadAll();
      if(dropped.length&&!S.leaving) S.notice[S.me]='You were removed from ‘'+dropped[0].name+'’.';
      renderKeepFocus();
    }catch(e){ console.warn('reload failed',e); }
  },700);
}
function startRealtime(){
  if(rt) return;
  rt=sb.channel('pizzico-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'recipes'},onRecipeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'books'},queueReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'book_members'},queueReload)
    .subscribe();
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.me&&sb) queueReload(); });

// ----- export (backup file) -----
function exportRecipes(){
  const bk=curBook(); if(!bk){ toast('No recipe book to export'); return; }
  const people={}; bk.members.forEach(k=>{ people[k]=USERS[k].name; });
  const dayStamp=new Date().toISOString().slice(0,10);
  const data={ pizzico_export:1, exported_at:new Date().toISOString(), book:bk.name, people,
    recipes:bk.recipes.map(strip), recently_deleted:(bk.trash||[]).map(t=>strip(t.r)) };
  const slug=(bk.name||'book').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'book';
  const name='pizzico-'+slug+'-'+dayStamp+'.json';
  const file=new File([JSON.stringify(data,null,2)],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(()=>toast('Exported '+bk.recipes.length+' recipes'),e=>{ if(!e||e.name!=='AbortError') toast('Couldn’t export'); });
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Exported '+bk.recipes.length+' recipes');
}

// ----- restore from a backup file -----
function pickRestoreFile(){
  document.querySelectorAll('input[data-restore]').forEach(x=>x.remove());
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json'; i.setAttribute('data-restore','1'); i.style.display='none';
  i.addEventListener('change',async()=>{ const f=i.files&&i.files[0]; i.remove(); if(f) readRestoreFile(f); });
  document.body.appendChild(i); i.click();
}
async function readRestoreFile(f){
  let j; try{ if(f.size>20e6) throw 0; j=JSON.parse(await f.text()); }catch(e){ toast('That isn’t a Pizzico backup file',false,3000); return; }
  if(!j||j.pizzico_export!==1||!Array.isArray(j.recipes)){ toast('That isn’t a Pizzico backup file',false,3000); return; }
  const bk=curBook(); if(!bk){ toast('Open a recipe book first'); return; }
  const have=[...recipes,...trash.map(t=>t.r)];
  const seenUrl=new Set(have.map(r=>urlKey(r.url)).filter(Boolean)), seenTitle=new Set(have.filter(r=>!urlKey(r.url)).map(r=>String(r.title||'').trim().toLowerCase()));
  const fresh=[]; let skipped=0;
  for(const raw of j.recipes.slice(0,2000)){
    if(!raw||typeof raw!=='object'||!String(raw.title||'').trim()&&!raw.url) { continue; }
    const k=urlKey(raw.url), t=String(raw.title||'').trim().toLowerCase();
    if(k?seenUrl.has(k):seenTitle.has(t)){ skipped++; continue; }
    if(k) seenUrl.add(k); else seenTitle.add(t);
    fresh.push(raw);
  }
  S.restore={file:f.name,when:j.exported_at?new Date(j.exported_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'',fresh,skipped,total:j.recipes.length,people:j.people&&typeof j.people==='object'?j.people:{}};
  S.sheet='restore'; render();
}
function restoreNow(){
  const x=S.restore, bk=curBook(); if(!x||!bk) return;
  // an old person who is now a different id (e.g. a phone that forgot who it was): match by name
  const byName={}; bk.members.forEach(k=>{ byName[String(USERS[k].name).trim().toLowerCase()]=k; });
  const map=id=>{ if(bk.members.includes(id)) return id; const nm=String(x.people[id]||'').trim().toLowerCase(); return byName[nm]||id; };
  const remap=o=>{ const out={}; Object.entries(o&&typeof o==='object'&&!Array.isArray(o)?o:{}).forEach(([k,v])=>{ out[map(k)]=v; }); return out; };
  let n=0;
  x.fresh.slice().reverse().forEach(raw=>{
    const r=JSON.parse(JSON.stringify(raw)); delete r.sid; delete r.id;
    const base=REC_DEFAULTS();
    const nr=R(Object.assign(base,r,{
      favs:remap(r.favs), ratings:remap(r.ratings),
      comments:(Array.isArray(r.comments)?r.comments:[]).map(c=>Object.assign({},c,{who:map(c&&c.who)})),
      added:map(r.added)||S.me, ingredients:Array.isArray(r.ingredients)?r.ingredients:[], method:Array.isArray(r.method)?r.method:[],
      meals:Array.isArray(r.meals)?r.meals:[], mains:Array.isArray(r.mains)?r.mains:[], diets:Array.isArray(r.diets)?r.diets:[], custom:Array.isArray(r.custom)?r.custom:[] }));
    if(r.editedBy) nr.editedBy=map(r.editedBy);
    recipes.unshift(nr); n++;
  });
  S.restore=null; S.sheet=null; S.tab='library'; S.view=null;
  toast('Added '+n+' recipe'+(n===1?'':'s'),false,3000); queueSync();
}

// ----- photos -----
function removePhoto(url){ try{ const i=url?url.indexOf('/photos/'):-1; if(i>0) sb.storage.from('photos').remove([decodeURIComponent(url.slice(i+8))]); }catch(e){} }
async function uploadPhoto(r,file){
  const b=S.books.find(x=>x.recipes.includes(r)); if(!b){ toast('Couldn’t add the photo'); return; }
  toast('Adding photo…',false,10000);
  try{
    const blob=await new Promise((ok,bad)=>{ const u=URL.createObjectURL(file), im=new Image();
      im.onload=()=>{ const k=Math.min(1,1200/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(x=>x?ok(x):bad(new Error('Couldn’t read that photo.')),'image/jpeg',.82); };
      im.onerror=()=>{ URL.revokeObjectURL(u); bad(new Error('Couldn’t open that photo.')); }; im.src=u; });
    const path=b.id+'/'+crypto.randomUUID()+'.jpg';
    const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'}); if(error) throw error;
    const old=r.photo; r.photo=sb.storage.from('photos').getPublicUrl(path).data.publicUrl; r.photoBy=S.me; removePhoto(old);
    toast('Photo added');
  }catch(e){ toast(friendly(e),false,4000); }
}

// ----- signing in and out -----
async function enter(session){
  const uid=session.user.id; S.me=uid; S.email=session.user.email||'';
  S.dev[uid]=S.dev[uid]||{units:'metric',bookId:store.get('book')||null};
  S.onb[uid]=S.onb[uid]||{step:'welcome',name:'',bookName:'Our Recipe Book',code:'',err:'',open:false};
  try{ await loadAll(); }catch(e){ console.warn(e); toast('Couldn’t load your recipes. Check your connection.',false,4000); }
  S.ready=true; S.tab='library'; startRealtime(); render();
}
function goSignedOut(){
  if(rt){ try{ sb.removeChannel(rt); }catch(e){} rt=null; }
  S.me=null; S.email=''; S.books=[]; recipes=[]; plan={}; S.shop=[]; trash=[]; active=null; S.view=null; S.sheet=null; S.tab='library';
  saved.rec.clear(); saved.del.clear(); saved.book.clear();
  S.auth={step:'email',email:S.auth.email||'',name:S.auth.name||'',code:'',err:'',busy:false}; S.ready=true; render();
}
async function boot(){
  render();
  if(!window.supabase){ S.ready=true; S.auth.err='Couldn’t load the sign-in tools. Check your connection and reload.'; render(); return; }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') goSignedOut(); });
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session) await enter(data.session); else { S.ready=true; render(); }
  }catch(e){ S.ready=true; S.auth.err=friendly(e); render(); }
}
function viewSignIn(){
  const a=S.auth, head=welcomeHead();
  if(!S.ready) return head+'<div class="muted" style="text-align:center">Loading…</div>';
  const err=a.err?`<div class="note err" role="alert">${esc(a.err)}</div>`:'';
  return head+`<div class="field"><label>Your name</label><input data-in="auth_name" value="${esc(a.name)}" placeholder="What should we call you?" autocomplete="given-name"></div>${err}
    <button class="btn" data-act="authgo" ${a.busy?'disabled':''}>${a.busy?'Starting…':'Get started'}</button>
    <div class="muted" style="text-align:center;margin-top:12px">No email or password. You stay signed in on this phone. On iPhone, add Pizzico to your Home Screen first (Share, then Add to Home Screen) and open it from there.</div>`;
}

boot();
</script>
